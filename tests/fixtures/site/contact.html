<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contact</title>
  </head>
  <body>
    <h1>Contact</h1>
    <form method="post" action="/contact">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required minlength="5" />
      <label>
        <input type="checkbox" name="agree" required />
        Agree
      </label>
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
